name: Verify execution attribution

on:
  push:
    branches:
      - experiment/execution-attribution-20261005

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install numpy==1.26.4 pandas==2.2.3 cython pyyaml ruamel.yaml fire loguru tqdm pytest modal lightgbm mlflow dill filelock joblib pyarrow pydantic-settings redis python-redis-lock pymongo gym cvxpy matplotlib setuptools-scm
          pip install . --no-build-isolation --no-deps
          python setup.py build_ext --inplace
      - name: Compile changed modules
        run: |
          python -m py_compile board_execution.py freq_experiment.py modal_qlib_cn_a10g.py tests/test_board_execution.py tests/test_review_regressions.py
      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m unittest             tests.test_board_execution             tests.test_qlib_board_rules             tests.test_review_regressions             tests.test_qlib_live_retrain             tests.test_paper_portfolio -v
          PYTHONPATH=. python -m pytest tests/test_cron_gate.py -q
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
