name: Verify satellite gate screen

on:
  push:
    branches:
      - audit/chinext-star-gate-screen

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: pip install numpy==1.26.4 pandas==2.2.3 pyarrow
      - name: Compile audit code
        run: |
          python -m py_compile satellite_audit_core.py satellite_pre_tuner_audit.py tests/test_satellite_audit.py
      - name: Run focused regressions
        run: |
          PYTHONPATH=. python -m unittest             tests.test_satellite_audit             tests.test_review_regressions             tests.test_portfolio_performance             tests.test_phase_attribution             tests.test_phase_regime_age -v
      - name: Diff check
        run: git diff --check origin/main...HEAD
