name: Unified paper execution and NAV verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'quant/code/production/paper_accounting.py'
      - 'quant/code/production/paper_halt_evidence.py'
      - 'quant/code/execution/execution_limits.py'
      - 'quant/code/execution/board_execution.py'
      - 'quant/code/production/paper_portfolio.py'
      - 'quant/code/production/paper_replay.py'
      - 'quant/code/production/forward_performance.py'
      - 'quant/code/production/modal_qlib_cn_a10g.py'
      - 'quant/code/research/stage_ab/csi1000_stage_b.py'
      - 'quant/code/ops/build_forward_performance.py'
      - 'quant/code/ops/accept_forward_nav.py'
      - 'quant/website/app.js'
      - 'quant/tests/test_paper_accounting_replay.py'
      - 'quant/tests/test_forward_nav_acceptance.py'
      - 'quant/tests/test_paper_portfolio.py'
      - 'quant/tests/test_forward_performance.py'
      - 'quant/docs/04-mvp-and-website/49-csi1000-forward-nav-acceptance-20261011.md'
      - '.github/workflows/unified-paper-nav.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  pure-python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal audit dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest numpy
      - name: Compile all changed Python paths
        run: |
          python -m py_compile quant/code/production/paper_accounting.py quant/code/production/paper_halt_evidence.py quant/code/execution/execution_limits.py quant/code/execution/board_execution.py quant/code/production/paper_portfolio.py quant/code/production/paper_replay.py quant/code/production/forward_performance.py quant/code/production/modal_qlib_cn_a10g.py quant/code/research/stage_ab/csi1000_stage_b.py quant/code/ops/build_forward_performance.py quant/code/ops/accept_forward_nav.py
          node --check quant/website/app.js
      - name: Historical and forward share execution/valuation contracts
        run: python -m pytest -q quant/tests/test_paper_accounting_replay.py quant/tests/test_paper_portfolio.py quant/tests/test_forward_performance.py quant/tests/test_forward_nav_acceptance.py
      - name: Build public forward series without future data
        run: |
          python quant/code/ops/build_forward_performance.py --signals quant/data/signals --output /tmp/forward.json
          python -c 'import json; x=json.load(open("/tmp/forward.json")); assert x["start_date"]=="2026-10-12"; assert x["status"] in ("awaiting_first_valuation","active")'
      - name: Read-only acceptance before first real post-start settlement
        run: |
          python quant/code/ops/accept_forward_nav.py --signals quant/data/signals --forward /tmp/forward.json --output /tmp/nav-acceptance.json
          python -c 'import json; v=json.load(open("/tmp/nav-acceptance.json")); assert v["status"] == "NOT_STARTED", v'
      - name: CI evidence scope
        run: |
          echo 'Code/fixture gate only. No private provider access, no exchange fill certification, no frozen Stage-B rewrite.' >> "$GITHUB_STEP_SUMMARY"
