name: Apply Qlib live retraining upgrade (temporary)

on:
  push:
    branches:
      - fix/qlib-audit-20260919
    paths:
      - qlib_live_retrain.py
      - tests/test_qlib_live_retrain.py
      - apply_qlib_live_update.py
      - docs/experiments/07-live-retrain.md
      - .github/workflows/qlib-live-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and exact source compatibility
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_qlib_audit*.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_qlib_live*.py' -v
          python apply_qlib_live_update.py --check
      - name: Apply, compile, and inspect source diff
        run: |
          python apply_qlib_live_update.py --apply
          python -m py_compile modal_qlib_cn_a10g.py qlib_live_retrain.py apply_qlib_live_update.py
          git diff --check
          git add -- modal_qlib_cn_a10g.py
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'No source changes produced'; exit 1; fi
          grep -F 'model_obj.predict(dataset, segment="test")' modal_qlib_cn_a10g.py
          grep -F 'MODEL_CFG["lgb158"]' modal_qlib_cn_a10g.py
      - name: Commit only modified production source to audit branch
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: monthly point-in-time retraining and aligned validation tuning'
          git push origin HEAD:fix/qlib-audit-20260919
