name: CSI1000 prospective shadow pair preflight

on:
  pull_request:
    paths:
      - "quant/code/audit/forward_shadow_pair_preflight.py"
      - "quant/tests/test_forward_shadow_pair_preflight.py"
      - ".github/workflows/csi1000-forward-shadow-pair-preflight.yml"
  workflow_dispatch:

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  shadow-pair-negative-controls:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m compileall -q quant/code/audit/forward_shadow_pair_preflight.py quant/tests/test_forward_shadow_pair_preflight.py
      - run: python -m pytest -q quant/tests/test_forward_shadow_pair_preflight.py
