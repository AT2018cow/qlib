name: Verify pre-tuner audit

on:
  push:
    branches:
      - fix/pre-tuner-audit-20261006

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: pip install numpy==1.26.4 pandas==2.2.3 pyarrow
      - name: Compile changed code
        run: |
          python -m py_compile board_execution.py freq_experiment.py modal_qlib_cn_a10g.py portfolio_performance.py tests/test_board_execution.py tests/test_review_regressions.py
      - name: Run source and metric regressions
        run: |
          PYTHONPATH=. python -m unittest tests.test_review_regressions tests.test_portfolio_performance tests.test_paper_portfolio -v
      - name: Exercise CNY tick factor logic without importing full Qlib
        run: |
          python - <<'PY'
          import sys, types
          qlib = types.ModuleType("qlib")
          backtest = types.ModuleType("qlib.backtest")
          exchange = types.ModuleType("qlib.backtest.exchange")
          exchange.Exchange = object
          sys.modules["qlib"] = qlib
          sys.modules["qlib.backtest"] = backtest
          sys.modules["qlib.backtest.exchange"] = exchange
          from board_execution import compute_limit_masks
          lb, ls = compute_limit_masks(
              ["SH600519"], ["2026-09-15"], [0.1100], [0.1001], [False], factors=[0.01]
          )
          assert not bool(lb[0]) and not bool(ls[0]), (lb, ls)
          lb, _ = compute_limit_masks(
              ["SH600519"], ["2026-09-15"], [0.1101], [0.1001], [False], factors=[0.01]
          )
          assert bool(lb[0]), lb
          try:
              compute_limit_masks(
                  ["SH600519"], ["2026-09-15"], [1.1], [1.0], [False], factors=[float("nan")]
              )
          except ValueError:
              pass
          else:
              raise AssertionError("invalid factor did not fail closed")
          PY
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
