name: Deploy signal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'quant/data/signals/**'
      - 'quant/website/**'
      - 'quant/code/production/forward_performance.py'
      - 'quant/code/ops/build_forward_performance.py'
      - 'quant/code/ops/merge_forward_performance.py'
      - 'quant/tests/test_publication_e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only a boolean is exposed to the build/test steps.  The actual
      # Cloudflare token is scoped to the deploy step below.
      CLOUDFLARE_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages publishing is paused until repository variable GITHUB_PAGES_ENABLED is set to true.
      - name: Setup Pages
        if: ${{ vars.GITHUB_PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5
      - name: Verify committed publication artifacts
        run: node --test quant/tests/test_publication_e2e.cjs
      - name: Build site
        run: |
          mkdir -p _site/signals
          # Keep all local HTML/JS/CSS dependencies together in Pages artifact.
          cp quant/website/*.html quant/website/*.js quant/website/*.css quant/website/*.svg quant/website/*.png quant/website/*.ico _site/
          cp quant/data/signals/*.csv quant/data/signals/*.json _site/signals/
          python3 quant/website/build_index.py \
            --signals quant/data/signals \
            --output _site/signals/available_dates.json
          python3 quant/website/build_index.py \
            --signals quant/data/signals \
            --market csi500 \
            --output _site/signals/available_dates_csi500.json
          python3 quant/website/build_index.py \
            --signals quant/data/signals \
            --market csi300 \
            --output _site/signals/available_dates_csi300.json
          # October is a disclosed BACKFILL_RESEARCH prefix.  Build the live
          # ledger separately and splice it onto the prefix, so the first live
          # session continues the 10/30 account instead of resetting the
          # dashboard to "awaiting first valuation".
          for market in csi1000 csi500 csi300; do
            python3 quant/code/ops/build_forward_performance.py \
              --signals quant/data/signals \
              --market "$market" \
              --output "/tmp/${market}_live.json"
            python3 quant/code/ops/merge_forward_performance.py \
              --prefix "quant/data/signals/${market}_backfill_performance.json" \
              --live "/tmp/${market}_live.json" \
              --output "_site/signals/${market}_forward_performance.json"
          done
          # Fail the deployment before uploading if a required site asset is missing.
          test -s _site/index.html
          test -s _site/methodology.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/favicon.svg
          test -s _site/favicon-32.png
          test -s _site/favicon.ico
          test -s _site/apple-touch-icon.png
          test -s _site/signals/available_dates.json
          test -s _site/signals/available_dates_csi500.json
          test -s _site/signals/available_dates_csi300.json
          test -s _site/signals/csi1000_forward_performance.json
          test -s _site/signals/csi500_forward_performance.json
          test -s _site/signals/csi300_forward_performance.json
      - name: Upload artifact
        if: ${{ vars.GITHUB_PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy mirror to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_ENABLED == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash quant/website/deploy_cloudflare.sh _site

  deploy:
    needs: build
    if: ${{ vars.GITHUB_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
