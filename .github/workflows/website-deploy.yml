name: Deploy signal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'results/signals/**'
      - 'website/**'
      - 'forward_performance.py'
      - 'scripts/build_forward_performance.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site/signals
          # Keep all local HTML/JS/CSS dependencies together in Pages artifact.
          cp website/*.html website/*.js website/*.css website/*.svg _site/
          cp results/signals/*.csv results/signals/*.json _site/signals/
          python3 scripts/build_forward_performance.py \
            --signals results/signals \
            --output _site/signals/csi1000_forward_performance.json
          python3 scripts/build_signal_dates_index.py \
            --signals results/signals \
            --output _site/signals/available_dates.json
          # Fail the deployment before uploading if a required site asset is missing.
          test -s _site/index.html
          test -s _site/methodology.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/favicon.svg
          test -s _site/signals/csi1000_forward_performance.json
          test -s _site/signals/available_dates.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
