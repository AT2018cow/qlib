name: CSI1000 Stage-A corrected replay (synthetic gates)

on:
  pull_request:
    paths:
      - "quant/code/audit/replay_stage_a_corrected.py"
      - "quant/code/audit/stage_a_corrected_replay_modal.py"
      - "quant/tests/test_stage_a_corrected_replay.py"
      - ".github/workflows/csi1000-stage-a-corrected-replay.yml"
  workflow_dispatch:

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  synthetic-input-and-replay-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install narrow test dependencies (no Modal token or provider)
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "numpy==1.26.4" "pandas==2.2.3"
      - name: Compile new replay code and synthetic gates
        run: python -m compileall -q quant/code/audit/replay_stage_a_corrected.py quant/code/audit/stage_a_corrected_replay_modal.py quant/tests/test_stage_a_corrected_replay.py
      - name: Run isolated synthetic negative controls
        run: python -m pytest -q quant/tests/test_stage_a_corrected_replay.py
