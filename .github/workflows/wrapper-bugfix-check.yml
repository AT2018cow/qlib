name: Wrapper bugfix verification

on:
  push:
    branches:
      - fix/qlib-wrapper-bugs-20261005

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install fire loguru tqdm pandas pytest
      - name: Compile changed Python
        run: python -m py_compile modal_qlib_cn_a10g.py qlib_live_retrain.py scripts/check_data_health.py tests/test_cron_gate.py tests/test_review_regressions.py tests/test_data_health_wrapper.py
      - name: Run focused wrapper tests
        run: |
          PYTHONPATH=. python -m unittest             tests.test_qlib_audit_fixes             tests.test_qlib_live_retrain             tests.test_review_regressions             tests.test_data_health_wrapper -v
          PYTHONPATH=. python -m pytest tests/test_cron_gate.py -q
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
