name: Verify portfolio metrics
# final-head verification

on:
  push:
    branches:
      - fix/portfolio-performance-metrics-20261006

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy==1.26.4 pandas==2.2.3
      - name: Compile changed modules
        run: |
          python -m py_compile portfolio_performance.py freq_experiment.py modal_qlib_cn_a10g.py tests/test_portfolio_performance.py tests/test_review_regressions.py
      - name: Run focused tests
        run: |
          PYTHONPATH=. python -m unittest tests.test_portfolio_performance tests.test_review_regressions -v
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
