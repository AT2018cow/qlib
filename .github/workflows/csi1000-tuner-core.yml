name: CSI1000 tuner core checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'csi1000_tuner.py'
      - 'csi1000_tuner_core.py'
      - 'deterministic_strategy.py'
      - 'csi1000_tuner_audit.py'
      - 'csi1000_stage_b.py'
      - 'csi1000_stage_b_core.py'
      - 'csi1000_production_config.py'
      - 'signal_publication_gate.py'
      - 'paper_portfolio.py'
      - 'modal_qlib_cn_a10g.py'
      - 'tests/test_csi1000_production_config.py'
      - 'tests/test_paper_portfolio.py'
      - 'tests/test_cron_gate.py'
      - 'tests/test_modal_structure.py'
      - 'tests/test_production_surface.py'
      - 'website/app.js'
      - 'website/index.html'
      - 'website/styles.css'
      - 'website/methodology.html'
      - 'docs/experiments/19-csi1000-stage-b-final-audit-forward-contract-20261008.md'
      - 'docs/experiments/20-csi1000-stage-b-winner-canonical-promotion-20261008.md'
      - 'tests/test_csi1000_tuner_core.py'
      - 'tests/test_csi1000_stage_b_core.py'
      - 'docs/experiments/16-csi1000-stage-a-tuning-contract-20261007.md'
      - 'docs/experiments/17-csi1000-stage-a-expanded-screen-runbook-20261007.md'
      - 'docs/experiments/18-next-conversation-handoff-stage-b-20261007.md'
      - '.github/workflows/csi1000-tuner-core.yml'
  push:
    branches: [main]
    paths:
      - 'csi1000_tuner.py'
      - 'csi1000_tuner_core.py'
      - 'deterministic_strategy.py'
      - 'csi1000_tuner_audit.py'
      - 'csi1000_stage_b.py'
      - 'csi1000_stage_b_core.py'
      - 'csi1000_production_config.py'
      - 'signal_publication_gate.py'
      - 'paper_portfolio.py'
      - 'modal_qlib_cn_a10g.py'
      - 'tests/test_csi1000_production_config.py'
      - 'tests/test_paper_portfolio.py'
      - 'tests/test_cron_gate.py'
      - 'tests/test_modal_structure.py'
      - 'tests/test_production_surface.py'
      - 'website/app.js'
      - 'website/index.html'
      - 'website/styles.css'
      - 'website/methodology.html'
      - 'docs/experiments/19-csi1000-stage-b-final-audit-forward-contract-20261008.md'
      - 'docs/experiments/20-csi1000-stage-b-winner-canonical-promotion-20261008.md'
      - 'tests/test_csi1000_tuner_core.py'
      - 'tests/test_csi1000_stage_b_core.py'
      - 'docs/experiments/17-csi1000-stage-a-expanded-screen-runbook-20261007.md'
      - 'docs/experiments/18-next-conversation-handoff-stage-b-20261007.md'
      - '.github/workflows/csi1000-tuner-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile CSI1000 production migration
        run: >-
          python -m py_compile
          csi1000_production_config.py
          signal_publication_gate.py
          paper_portfolio.py
          modal_qlib_cn_a10g.py
      - name: Validate website JavaScript
        run: node --check website/app.js
      - name: Run full CSI1000 Stage-A, Stage-B and production contract tests
        run: >-
          python -m pytest -q
          tests/test_csi1000_tuner_core.py
          tests/test_csi1000_stage_b_core.py
          tests/test_csi1000_production_config.py
          tests/test_paper_portfolio.py
          tests/test_cron_gate.py
          tests/test_modal_structure.py
          tests/test_production_surface.py
