name: CSI1000 tuner core checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'quant/code/research/stage_ab/csi1000_tuner.py'
      - 'quant/code/research/stage_ab/csi1000_tuner_core.py'
      - 'quant/code/execution/deterministic_strategy.py'
      - 'quant/code/research/stage_ab/csi1000_tuner_audit.py'
      - 'quant/code/research/stage_ab/csi1000_stage_b.py'
      - 'quant/code/research/stage_ab/csi1000_stage_b_core.py'
      - 'quant/code/production/csi1000_production_config.py'
      - 'quant/code/production/signal_publication_gate.py'
      - 'quant/code/production/paper_portfolio.py'
      - 'quant/code/production/forward_performance.py'
      - 'quant/code/production/chart_series.py'
      - 'quant/tests/test_chart_series.py'
      - 'quant/tests/test_sparkline_frontend.cjs'
      - 'quant/tests/test_website_index.py'
      - 'quant/website/build_index.py'
      - 'quant/code/ops/build_forward_performance.py'
      - 'quant/code/production/modal_qlib_cn_a10g.py'
      - 'quant/tests/test_csi1000_production_config.py'
      - 'quant/tests/test_paper_portfolio.py'
      - 'quant/tests/test_forward_performance.py'
      - 'quant/tests/test_cron_gate.py'
      - 'quant/tests/test_modal_structure.py'
      - 'quant/tests/test_production_surface.py'
      - 'quant/website/app.js'
      - 'quant/website/index.html'
      - 'quant/website/styles.css'
      - 'quant/website/favicon.svg'
      - 'quant/website/methodology.html'
      - 'quant/docs/02-round1-stage-ab/19-csi1000-stage-b-final-audit-forward-contract-20261008.md'
      - 'quant/docs/02-round1-stage-ab/20-csi1000-stage-b-winner-canonical-promotion-20261008.md'
      - 'quant/tests/test_csi1000_tuner_core.py'
      - 'quant/tests/test_csi1000_stage_b_core.py'
      - 'quant/docs/02-round1-stage-ab/16-csi1000-stage-a-tuning-contract-20261007.md'
      - 'quant/docs/02-round1-stage-ab/17-csi1000-stage-a-expanded-screen-runbook-20261007.md'
      - 'quant/docs/02-round1-stage-ab/18-next-conversation-handoff-stage-b-20261007.md'
      - '.github/workflows/csi1000-tuner-core.yml'
      - '.github/workflows/website-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'quant/code/research/stage_ab/csi1000_tuner.py'
      - 'quant/code/research/stage_ab/csi1000_tuner_core.py'
      - 'quant/code/execution/deterministic_strategy.py'
      - 'quant/code/research/stage_ab/csi1000_tuner_audit.py'
      - 'quant/code/research/stage_ab/csi1000_stage_b.py'
      - 'quant/code/research/stage_ab/csi1000_stage_b_core.py'
      - 'quant/code/production/csi1000_production_config.py'
      - 'quant/code/production/signal_publication_gate.py'
      - 'quant/code/production/paper_portfolio.py'
      - 'quant/code/production/forward_performance.py'
      - 'quant/code/production/chart_series.py'
      - 'quant/tests/test_chart_series.py'
      - 'quant/tests/test_sparkline_frontend.cjs'
      - 'quant/tests/test_website_index.py'
      - 'quant/website/build_index.py'
      - 'quant/code/ops/build_forward_performance.py'
      - 'quant/code/production/modal_qlib_cn_a10g.py'
      - 'quant/tests/test_csi1000_production_config.py'
      - 'quant/tests/test_paper_portfolio.py'
      - 'quant/tests/test_forward_performance.py'
      - 'quant/tests/test_cron_gate.py'
      - 'quant/tests/test_modal_structure.py'
      - 'quant/tests/test_production_surface.py'
      - 'quant/website/app.js'
      - 'quant/website/index.html'
      - 'quant/website/styles.css'
      - 'quant/website/favicon.svg'
      - 'quant/website/methodology.html'
      - 'quant/docs/02-round1-stage-ab/19-csi1000-stage-b-final-audit-forward-contract-20261008.md'
      - 'quant/docs/02-round1-stage-ab/20-csi1000-stage-b-winner-canonical-promotion-20261008.md'
      - 'quant/tests/test_csi1000_tuner_core.py'
      - 'quant/tests/test_csi1000_stage_b_core.py'
      - 'quant/docs/02-round1-stage-ab/17-csi1000-stage-a-expanded-screen-runbook-20261007.md'
      - 'quant/docs/02-round1-stage-ab/18-next-conversation-handoff-stage-b-20261007.md'
      - '.github/workflows/csi1000-tuner-core.yml'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile CSI1000 production migration
        run: >-
          python -m py_compile
          quant/code/production/csi1000_production_config.py
          quant/code/production/signal_publication_gate.py
          quant/code/production/paper_portfolio.py
          quant/code/production/forward_performance.py
          quant/code/production/chart_series.py
          quant/code/ops/build_forward_performance.py
          quant/code/production/modal_qlib_cn_a10g.py
      - name: Validate website JavaScript
        run: node --check quant/website/app.js
      - name: Verify sparkline behavior and CSS layout semantics
        run: node --test quant/tests/test_sparkline_frontend.cjs
      - name: Run full CSI1000 Stage-A, Stage-B and production contract tests
        run: >-
          python -m pytest -q
          quant/tests/test_csi1000_tuner_core.py
          quant/tests/test_csi1000_stage_b_core.py
          quant/tests/test_csi1000_production_config.py
          quant/tests/test_paper_portfolio.py
          quant/tests/test_forward_performance.py
          quant/tests/test_chart_series.py
          quant/tests/test_cron_gate.py
          quant/tests/test_modal_structure.py
          quant/tests/test_production_surface.py
          quant/tests/test_website_index.py
