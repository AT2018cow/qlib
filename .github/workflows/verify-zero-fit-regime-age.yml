name: Verify zero-fit regime model-age attribution

on:
  push:
    branches:
      - audit/zero-fit-regime-model-age

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: pip install numpy==1.26.4 pandas==2.2.3 pyarrow
      - name: Compile attribution code
        run: |
          python -m py_compile phase_regime_age_core.py phase_regime_age_diagnostic.py tests/test_phase_regime_age.py
      - name: Run focused regressions
        run: |
          PYTHONPATH=. python -m unittest tests.test_phase_regime_age tests.test_phase_attribution tests.test_review_regressions tests.test_portfolio_performance -v
      - name: Diff check
        run: git diff --check origin/main...HEAD
