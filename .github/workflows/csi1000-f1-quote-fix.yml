name: CSI1000 F1 quote-universe regression (CPU only)

on:
  push:
    branches: ["fix/csi1000-f1-quote-universe-20261009"]
    paths:
      - "quant/code/execution/execution_quote_universe.py"
      - "quant/code/research/stage_ab/csi1000_stage_b.py"
      - "quant/code/audit/replay_stage_b_f1.py"
      - "quant/tests/test_execution_quote_universe.py"
      - ".github/workflows/csi1000-f1-quote-fix.yml"
  pull_request:
    paths:
      - "quant/code/execution/execution_quote_universe.py"
      - "quant/code/research/stage_ab/csi1000_stage_b.py"
      - "quant/code/audit/replay_stage_b_f1.py"
      - "quant/tests/test_execution_quote_universe.py"
      - ".github/workflows/csi1000-f1-quote-fix.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ".:quant:quant/code:quant/code/production:quant/code/execution:quant/code/research/stage_ab:quant/code/research/layered_search:quant/code/research/pre_tuner:quant/code/audit:quant/code/ops:quant/website"

jobs:
  synthetic-quote-union:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse changed Python modules without importing Modal or Qlib
        run: python -m py_compile quant/code/execution/execution_quote_universe.py quant/code/research/stage_ab/csi1000_stage_b.py quant/code/audit/replay_stage_b_f1.py quant/tests/test_execution_quote_universe.py
      - name: Minimal deterministic F1 quote-universe tests
        run: python -m unittest discover -s quant/tests -p "test_execution_quote_universe.py" -v
