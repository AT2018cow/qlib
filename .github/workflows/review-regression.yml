name: Review regression checks

on:
  push:
    branches:
      - fix/qlib-review-20261005
    paths:
      - freq_experiment.py
      - modal_qlib_cn_a10g.py
      - tests/test_review_regressions.py
      - qlib_audit_fixes.py
      - qlib_live_retrain.py
      - .github/workflows/review-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Python
        run: python -m py_compile freq_experiment.py modal_qlib_cn_a10g.py qlib_audit_fixes.py qlib_live_retrain.py tests/test_review_regressions.py
      - name: Audit helper tests
        run: PYTHONPATH=. python -m unittest tests.test_qlib_audit_fixes tests.test_qlib_live_retrain tests.test_review_regressions -v
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
